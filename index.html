<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Comando remoto | ESP32</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220; --panel: #121d2e; --panel2: #18263a;
      --text: #edf4ff; --muted: #9aabc2; --line: #293950;
      --green: #16a36a; --red: #ef6461; --amber: #f3b64b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: grid; place-items: center;
      background: radial-gradient(circle at top, #1b2c43 0, var(--bg) 58%);
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main { width: min(100%, 520px); }
    .card {
      background: rgba(18,29,46,.96); border: 1px solid var(--line);
      border-radius: 22px; padding: 24px; box-shadow: 0 22px 70px #0006;
    }
    header { text-align: center; margin-bottom: 22px; }
    .mark {
      width: 54px; height: 54px; display: grid; place-items: center;
      margin: 0 auto 12px; border-radius: 16px;
      background: #173b32; color: #6ee7b7; font-size: 27px;
    }
    h1 { font-size: clamp(25px, 6vw, 32px); margin: 0; letter-spacing: .02em; }
    .status {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin: 20px 0; padding: 12px; border-radius: 12px;
      background: var(--panel2); color: var(--muted); font-size: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #7b8798; }
    .status.online { color: #8ce6bd; }
    .status.online .dot { background: #22c982; box-shadow: 0 0 12px #22c98299; }
    .status.error { color: #ffaaa7; }
    .status.error .dot { background: var(--red); }
    .fields { display: grid; gap: 11px; margin-bottom: 14px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input {
      width: 100%; padding: 12px 13px; border-radius: 10px;
      border: 1px solid var(--line); background: #0c1625; color: var(--text);
      font: inherit; font-size: 14px; outline: none;
    }
    input:focus { border-color: #4ba985; box-shadow: 0 0 0 3px #16a36a22; }
    .connect-row { display: flex; gap: 10px; }
    button {
      border: 0; border-radius: 12px; cursor: pointer; font: inherit;
      font-weight: 700; transition: transform .08s, filter .15s;
    }
    button:active { transform: scale(.985); }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .connect { flex: 1; padding: 13px; color: white; background: #2865a6; }
    .disconnect { padding: 13px 15px; color: var(--text); background: #293950; }
    .section-title {
      margin: 25px 0 11px; color: var(--muted); font-size: 12px;
      font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    }
    .buttons { display: grid; gap: 12px; }
    .command {
      min-height: 76px; color: white; font-size: 21px;
      letter-spacing: .03em; box-shadow: 0 8px 22px #0003;
    }
    .command[data-command="BOTAO_1"] { background: linear-gradient(135deg, #19b875, #087b4b); }
    .command[data-command="BOTAO_2"] { background: linear-gradient(135deg, #f05b5b, #b92535); }
    .command[data-command="BOTAO_3"] { background: linear-gradient(135deg, #398cf0, #1852b5); }
    .feedback {
      margin-top: 17px; min-height: 48px; padding: 13px;
      border: 1px solid var(--line); border-radius: 11px;
      background: #0c1625; color: var(--muted); font-size: 13px; text-align: center;
    }
    .camera-panel {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .camera-toggle {
      width: 100%; min-height: 58px; color: white; font-size: 18px;
      background: linear-gradient(135deg, #8b5cf6, #5b35bd);
    }
    .camera-toggle.active { background: linear-gradient(135deg, #d97706, #a34d08); }
    .camera-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 10px 0; }
    .camera-actions button { min-height: 48px; color: white; font-size: 13px; padding: 9px; }
    .live-start, .record-start { background: linear-gradient(135deg, #16a36a, #087b4b); }
    .live-stop, .record-stop { background: linear-gradient(135deg, #d65353, #a92335); }
    .recording-list { display: grid; gap: 8px; margin-top: 12px; }
    .recording-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #0c1625; font-size: 12px; }
    .recording-item button { padding: 9px 12px; color: white; background: #2865a6; }
    .playback-row { display: flex; gap: 8px; margin-top: 10px; }
    .playback-row button { flex: 1; min-height: 42px; color: white; background: #6545b5; }
    .camera-state {
      margin: 11px 0; color: var(--muted); font-size: 13px; text-align: center;
    }
    .camera-view {
      width: 100%; min-height: 170px; display: grid; place-items: center;
      overflow: hidden; border: 1px solid var(--line); border-radius: 13px;
      background: #08101c; color: var(--muted); font-size: 13px;
    }
    .camera-view img { display: block; width: 100%; height: auto; }
    .details {
      margin-top: 18px; color: var(--muted); font-size: 11px;
      line-height: 1.55; text-align: center;
    }
    @media (max-width: 380px) {
      .card { padding: 18px; } .command { min-height: 68px; }
    }
  </style>
</head>
<body>
<main>
  <section class="card">
    <header>
      <div class="mark">⌁</div>
      <h1>COMANDO REMOTO</h1>
    </header>

    <div id="status" class="status"><span class="dot"></span><span id="statusText">Desligado</span></div>

    <div class="fields">
      <label>Utilizador
        <input id="username" autocomplete="username" placeholder="Utilizador">
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      </label>
    </div>

    <div class="connect-row">
      <button id="connect" class="connect">Ligar</button>
      <button id="disconnect" class="disconnect" disabled>Desligar</button>
    </div>

    <div class="section-title">Enviar comando</div>
    <div class="buttons">
      <button class="command" data-command="BOTAO_1" disabled>BOTÃO 1</button>
      <button class="command" data-command="BOTAO_2" disabled>BOTÃO 2</button>
      <button class="command" data-command="BOTAO_3" disabled>BOTÃO 3</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite">Faz login para ativar os botões.</div>

    <section class="camera-panel">
      <div class="section-title">Câmara remota</div>
      <div class="camera-actions">
        <button id="cameraStart" class="live-start" disabled>INICIAR LIVE</button>
        <button id="cameraStop" class="live-stop" disabled>PARAR LIVE</button>
        <button id="recordStart" class="record-start" disabled>COMEÇAR A GRAVAR</button>
        <button id="recordStop" class="record-stop" disabled>TERMINAR GRAVAÇÃO</button>
      </div>
      <div id="cameraState" class="camera-state">Faz login para controlar a câmara.</div>
      <div class="playback-row">
        <button id="refreshRecordings" disabled>ATUALIZAR GRAVAÇÕES</button>
        <button id="stopPlayback" disabled>PARAR REPRODUÇÃO</button>
      </div>
      <div id="recordingList" class="recording-list"><div class="camera-state">Ainda não foram carregadas gravações.</div></div>
      <div class="camera-view">
        <span id="cameraPlaceholder">A imagem da câmara aparecerá aqui.</span>
        <img id="cameraImage" alt="" hidden>
      </div>
    </section>
    <div class="details">Live, gravação JPEG no SD e reprodução.</div>
  </section>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
(() => {
  const host = "h10032a7.ala.eu-central-1.emqxsl.com";
  const port = 8084;
  const commandTopic = "jogo/botao";
  const cameraControlTopic = "jogo/camera/controlo";
  const cameraFrameTopic = "jogo/camera/frame";

  const statusBox = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const feedback = document.getElementById("feedback");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const connectButton = document.getElementById("connect");
  const disconnectButton = document.getElementById("disconnect");
  const commandButtons = [...document.querySelectorAll(".command")];
  const cameraStart = document.getElementById("cameraStart");
  const cameraStop = document.getElementById("cameraStop");
  const recordStart = document.getElementById("recordStart");
  const recordStop = document.getElementById("recordStop");
  const refreshRecordings = document.getElementById("refreshRecordings");
  const stopPlayback = document.getElementById("stopPlayback");
  const recordingList = document.getElementById("recordingList");
  const cameraState = document.getElementById("cameraState");
  const cameraImage = document.getElementById("cameraImage");
  const cameraPlaceholder = document.getElementById("cameraPlaceholder");

  let client = null;
  let cameraActive = false;
  let recordingActive = false;
  let playbackActive = false;
  let listingRecordings = false;
  let currentImageUrl = null;
  let playbackImageUrl = null;
  let cameraHeartbeatTimer = null;

  function setStatus(kind, text) {
    statusBox.className = "status" + (kind ? " " + kind : "");
    statusText.textContent = text;
  }
  function setConnected(connected) {
    commandButtons.forEach(button => button.disabled = !connected);
    connectButton.disabled = connected;
    disconnectButton.disabled = !connected;
    [cameraStart, cameraStop, recordStart, recordStop, refreshRecordings].forEach(button => button.disabled = !connected);
    stopPlayback.disabled = !connected || !playbackActive;
  }
  function showFeedback(text) { feedback.textContent = text; }
  function setCameraActive(active) {
    cameraActive = active;
    cameraStart.disabled = !client || !client.connected || active;
    cameraStop.disabled = !client || !client.connected || !active;
    cameraState.textContent = active ? "Live ativo: a receber imagens..." : "Live parado.";
    if (!active && !playbackActive) {
      cameraImage.hidden = true; cameraPlaceholder.hidden = false;
      cameraPlaceholder.textContent = "Live parado.";
      if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
      currentImageUrl = null;
    }
  }
  function setRecordingActive(active) {
    recordingActive = active;
    recordStart.disabled = !client || !client.connected || active;
    recordStop.disabled = !client || !client.connected || !active;
    if (active) cameraState.textContent = "A gravar frames JPEG no cartão SD a 10 FPS (QVGA).";
    else if (!cameraActive && !playbackActive) cameraState.textContent = "Gravação parada.";
  }
  function publishControl(command, onSuccess) {
    if (!client || !client.connected) { showFeedback("Sem ligação MQTT. Liga primeiro."); return; }
    client.publish(cameraControlTopic, command, { qos: 0, retain: false }, error => {
      if (error) showFeedback("Falha ao enviar: " + command);
      else { showFeedback("Comando enviado: " + command); if (onSuccess) onSuccess(); }
    });
  }
  function showFrame(payload, isPlayback) {
    const blob = new Blob([payload], { type: "image/jpeg" });
    const oldUrl = isPlayback ? playbackImageUrl : currentImageUrl;
    if (oldUrl) URL.revokeObjectURL(oldUrl);
    const url = URL.createObjectURL(blob);
    if (isPlayback) playbackImageUrl = url; else currentImageUrl = url;
    cameraImage.onload = () => {
      cameraImage.hidden = false; cameraPlaceholder.hidden = true;
      cameraState.textContent = (isPlayback ? "A reproduzir gravação" : "Live ativo") + " · " + new Date().toLocaleTimeString();
    };
    cameraImage.src = url;
  }
  function addRecording(name, count) {
    const item = document.createElement("div"); item.className = "recording-item";
    const info = document.createElement("span"); info.textContent = name + " · " + count + " frames";
    const play = document.createElement("button"); play.textContent = "REPRODUZIR";
    play.addEventListener("click", () => {
      playbackActive = true; stopPlayback.disabled = false;
      publishControl("PLAY|" + name, () => { cameraState.textContent = "A pedir reprodução de " + name + " a 10 FPS..."; });
    });
    item.append(info, play); recordingList.appendChild(item);
  }

  connectButton.addEventListener("click", () => {
    if (typeof mqtt === "undefined") {
      setStatus("error", "Biblioteca MQTT não carregou");
      showFeedback("Verifica a ligação à Internet e atualiza a página.");
      return;
    }
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      showFeedback("Preenche o utilizador e a password.");
      return;
    }
    if (client) { client.end(true); client = null; }

    setStatus("", "A ligar...");
    showFeedback("A estabelecer ligação segura.");
    const clientId = "WEB_" + Math.random().toString(16).slice(2, 12);
    client = mqtt.connect(`wss://${host}:${port}/mqtt`, {
      clientId, username, password, clean: true,
      connectTimeout: 10000, reconnectPeriod: 3000, keepalive: 30
    });

    client.on("connect", () => {
      setStatus("online", "Ligado");
      showFeedback("Ligação estabelecida. Já podes enviar comandos.");
      setConnected(true);
      client.subscribe([cameraFrameTopic, "jogo/camera/reproducao/frame", "jogo/camera/resposta"], { qos: 0 }, error => {
        if (error) cameraState.textContent = "Não foi possível subscrever os tópicos da câmara.";
      });
    });
    client.on("message", (topic, payload) => {
      if (topic === cameraFrameTopic && cameraActive) { showFrame(payload, false); return; }
      if (topic === "jogo/camera/reproducao/frame" && playbackActive) { showFrame(payload, true); return; }
      if (topic === "jogo/camera/resposta") {
        const message = payload.toString();
        if (message === "LIST_BEGIN") { listingRecordings = true; recordingList.replaceChildren(); }
        else if (message.startsWith("REC|")) { const parts = message.split("|"); if (listingRecordings) addRecording(parts[1], parts[2] || "?"); }
        else if (message === "LIST_END") { listingRecordings = false; if (!recordingList.children.length) recordingList.textContent = "Não existem gravações no cartão SD."; }
        else if (message.startsWith("REC_STARTED|")) { setRecordingActive(true); cameraState.textContent = "Gravação iniciada: " + message.split("|")[1]; }
        else if (message.startsWith("REC_STOPPED|")) { setRecordingActive(false); cameraState.textContent = "Gravação terminada. " + message.split("|")[2] + " frames guardados."; }
        else if (message.startsWith("PLAY_STARTED|")) { playbackActive = true; stopPlayback.disabled = false; }
        else if (message.startsWith("PLAY_ENDED|")) { playbackActive = false; stopPlayback.disabled = true; cameraState.textContent = "Reprodução terminada. " + message.split("|")[2] + " frames enviados."; }
        else if (message.startsWith("PLAY_ERROR|") || message.startsWith("ERROR|") || message.startsWith("LIST_ERROR|")) { cameraState.textContent = "Câmara: " + message; }
      }
    });
    client.on("reconnect", () => {
      setStatus("", "A tentar restabelecer ligação...");
      setConnected(false);
      setCameraActive(false); setRecordingActive(false); playbackActive = false;
    });
    client.on("offline", () => {
      setStatus("", "Ligação perdida");
      setConnected(false);
      setCameraActive(false); setRecordingActive(false); playbackActive = false;
    });
    client.on("close", () => {
      setStatus("", "Desligado");
      setConnected(false);
      setCameraActive(false); setRecordingActive(false); playbackActive = false;
    });
    client.on("error", error => {
      setStatus("error", "Erro de ligação");
      showFeedback("Não foi possível ligar. Confirma as credenciais e tenta novamente.");
      setConnected(false);
      console.error("MQTT error:", error);
    });
  });

  disconnectButton.addEventListener("click", () => {
    if (client && client.connected) {
      if (cameraActive) client.publish(cameraControlTopic, "STOP", { qos: 0, retain: false });
      if (recordingActive) client.publish(cameraControlTopic, "REC_STOP", { qos: 0, retain: false });
      if (playbackActive) client.publish(cameraControlTopic, "PLAY_STOP", { qos: 0, retain: false });
    }
    if (client) { client.end(true); client = null; }
    setStatus("", "Desligado"); showFeedback("Desligado."); setConnected(false);
    setCameraActive(false); setRecordingActive(false); playbackActive = false;
  });

  commandButtons.forEach(button => {
    button.addEventListener("click", () => {
      if (!client || !client.connected) {
        showFeedback("Sem ligação. Liga primeiro.");
        setConnected(false);
        return;
      }
      const command = button.dataset.command;
      button.disabled = true;
      client.publish(commandTopic, command, { qos: 0, retain: false }, error => {
        button.disabled = false;
        if (error) showFeedback("Erro ao publicar " + command + ".");
        else showFeedback("Comando enviado: " + command);
      });
    });
  });

  cameraStart.addEventListener("click", () => publishControl("START", () => setCameraActive(true)));
  cameraStop.addEventListener("click", () => publishControl("STOP", () => setCameraActive(false)));
  recordStart.addEventListener("click", () => publishControl("REC_START"));
  recordStop.addEventListener("click", () => publishControl("REC_STOP"));
  refreshRecordings.addEventListener("click", () => {
    recordingList.replaceChildren(); listingRecordings = true; publishControl("LIST");
  });
  stopPlayback.addEventListener("click", () => {
    publishControl("PLAY_STOP", () => { playbackActive = false; stopPlayback.disabled = true; });
  });
})();
</script>
</body>
</html>
